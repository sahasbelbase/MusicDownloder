<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="studioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c853" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141822" />
      <stop offset="100%" stop-color="#0a0c10" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Studio Soundwave Bars -->
  <g fill="url(#studioGrad)" filter="url(#glow)">
    <!-- Bar 1 -->
    <rect x="13" y="26" width="5" height="12" rx="2.5" />
    <!-- Bar 2 -->
    <rect x="21" y="18" width="5" height="28" rx="2.5" />
    <!-- Bar 3 (Center High) -->
    <rect x="29" y="12" width="5" height="40" rx="2.5" />
    <!-- Bar 4 -->
    <rect x="37" y="20" width="5" height="24" rx="2.5" />
    <!-- Bar 5 -->
    <rect x="45" y="27" width="5" height="10" rx="2.5" />
  </g>
</svg>
