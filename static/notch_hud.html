<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mac Notch Dynamic Island HUD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --notch-h: 38px;
      --pill-h: 34px;
      --card-h: 106px;
      --emerald: #10b981;
      --emerald-glow: rgba(16, 185, 129, 0.45);
      --bg-notch: rgba(6, 9, 15, 0.96);
      --border-subtle: rgba(255, 255, 255, 0.12);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: var(--font-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Notch Floating Container */
    .notch-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top spacer sitting behind the MacBook's physical black camera notch bezel */
    .notch-hardware-spacer {
      width: 100%;
      height: var(--notch-h);
      flex-shrink: 0;
      background: transparent;
      pointer-events: none;
    }

    /* Collapsed Mini Pill: Hangs directly UNDERNEATH the physical camera notch */
    .notch-collapsed {
      position: absolute;
      top: var(--notch-h);
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: var(--pill-h);
      background: var(--bg-notch);
      backdrop-filter: blur(32px) saturate(200%);
      -webkit-backdrop-filter: blur(32px) saturate(200%);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      border: 1px solid var(--border-subtle);
      border-top: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mini-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .mini-cover {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: spin 8s linear infinite;
      animation-play-state: paused;
      flex-shrink: 0;
    }
    .mini-cover.is-spinning {
      animation-play-state: running;
    }

    .mini-title {
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 140px;
      letter-spacing: -0.01em;
    }

    .mini-eq {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 14px;
      flex-shrink: 0;
    }
    .mini-eq-bar {
      width: 2.5px;
      background: var(--emerald);
      border-radius: 2px;
      height: 3px;
      transition: height 0.15s ease;
    }
    .is-playing .mini-eq-bar:nth-child(1) { animation: eqBounce 0.65s infinite ease-in-out; }
    .is-playing .mini-eq-bar:nth-child(2) { animation: eqBounce 0.5s infinite ease-in-out 0.15s; }
    .is-playing .mini-eq-bar:nth-child(3) { animation: eqBounce 0.8s infinite ease-in-out 0.3s; }
    .is-playing .mini-eq-bar:nth-child(4) { animation: eqBounce 0.6s infinite ease-in-out 0.45s; }

    @keyframes eqBounce {
      0%, 100% { height: 3px; }
      50% { height: 14px; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Expanded Dynamic Island Player Card */
    .notch-expanded {
      position: absolute;
      top: var(--notch-h);
      left: 50%;
      transform: translateX(-50%) translateY(-6px) scale(0.97);
      width: 100%;
      height: var(--card-h);
      background: var(--bg-notch);
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 42px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(16, 185, 129, 0.25);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1), transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* State Switch without DOM Destruction (Prevents Jitter/Shaking) */
    .notch-container.is-expanded .notch-collapsed {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(-4px) scale(0.96);
    }
    .notch-container.is-expanded .notch-expanded {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0) scale(1);
    }

    /* Vinyl Record Cover */
    .vinyl-wrap {
      position: relative;
      width: 56px;
      height: 56px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #000;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65), 0 0 0 2px rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: spin 10s linear infinite;
      animation-play-state: paused;
    }
    .vinyl-wrap.is-spinning {
      animation-play-state: running;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.65), 0 0 12px var(--emerald-glow);
    }
    .vinyl-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .vinyl-center {
      position: absolute;
      width: 14px;
      height: 14px;
      background: #0f172a;
      border: 2px solid #fff;
      border-radius: 50%;
    }

    /* Track Meta & Scrubber Timeline */
    .meta-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .track-title {
      font-size: 0.90rem;
      font-weight: 800;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }

    .track-artist {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scrubber-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .scrubber-track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      position: relative;
      cursor: pointer;
    }
    .scrubber-fill {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: linear-gradient(90deg, #10b981 0%, #34d399 100%);
      border-radius: 2px;
      box-shadow: 0 0 8px var(--emerald-glow);
    }

    .time-badge {
      font-size: 0.68rem;
      font-family: var(--font-mono);
      color: var(--text-muted);
      flex-shrink: 0;
    }

    /* Controls */
    .controls-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .ctrl-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.08);
      color: #fff;
    }
    .ctrl-btn:active {
      transform: scale(0.95);
    }

    .ctrl-btn-primary {
      width: 40px;
      height: 40px;
      background: var(--emerald);
      color: #04140c;
      border: none;
      box-shadow: 0 4px 14px var(--emerald-glow);
    }
    .ctrl-btn-primary:hover {
      background: #059669;
      color: #04140c;
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
  </style>
</head>
<body>
  <div class="notch-container" id="notch-container">
    <!-- Top Spacer (Sits behind hardware camera notch) -->
    <div class="notch-hardware-spacer" id="hardware-spacer"></div>

    <!-- Collapsed Pill (Hugs Bottom of MacBook Camera Notch in plain sight) -->
    <div class="notch-collapsed" id="notch-collapsed" title="Hover to expand Music Studio controller">
      <div class="mini-left">
        <img class="mini-cover" id="mini-cover" src="placeholder.svg" alt="Cover" />
        <span class="mini-title" id="mini-title">Music Studio</span>
      </div>
      <div class="mini-eq" id="mini-eq">
        <div class="mini-eq-bar"></div>
        <div class="mini-eq-bar"></div>
        <div class="mini-eq-bar"></div>
        <div class="mini-eq-bar"></div>
      </div>
    </div>

    <!-- Expanded Dynamic Island Player Card -->
    <div class="notch-expanded" id="notch-expanded">
      <div class="vinyl-wrap" id="vinyl-wrap">
        <img class="vinyl-cover" id="expanded-cover" src="placeholder.svg" alt="Cover" />
        <div class="vinyl-center"></div>
      </div>

      <div class="meta-wrap">
        <div class="track-title" id="expanded-title">No Track Playing</div>
        <div class="track-artist" id="expanded-artist">Hover to control music</div>
        <div class="scrubber-wrap">
          <span class="time-badge" id="time-current">0:00</span>
          <div class="scrubber-track" id="scrubber-track">
            <div class="scrubber-fill" id="scrubber-fill"></div>
          </div>
          <span class="time-badge" id="time-duration">0:00</span>
        </div>
      </div>

      <div class="controls-wrap">
        <button class="ctrl-btn" id="btn-prev" title="Previous Track">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button class="ctrl-btn ctrl-btn-primary" id="btn-play" title="Play / Pause">
          <svg id="icon-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="icon-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button class="ctrl-btn" id="btn-next" title="Next Track">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Read dynamic hardware notch parameters from URL query params
    const urlParams = new URLSearchParams(window.location.search);
    const notchH = parseInt(urlParams.get('notch_h')) || 38;
    const pillH = parseInt(urlParams.get('pill_h')) || 34;
    document.documentElement.style.setProperty('--notch-h', notchH + 'px');
    document.documentElement.style.setProperty('--pill-h', pillH + 'px');

    const container = document.getElementById('notch-container');
    const miniCover = document.getElementById('mini-cover');
    const miniTitle = document.getElementById('mini-title');
    const miniEq = document.getElementById('mini-eq');
    const vinylWrap = document.getElementById('vinyl-wrap');
    const expandedCover = document.getElementById('expanded-cover');
    const expandedTitle = document.getElementById('expanded-title');
    const expandedArtist = document.getElementById('expanded-artist');
    const scrubberFill = document.getElementById('scrubber-fill');
    const scrubberTrack = document.getElementById('scrubber-track');
    const timeCurrent = document.getElementById('time-current');
    const timeDuration = document.getElementById('time-duration');
    const btnPlay = document.getElementById('btn-play');
    const btnNext = document.getElementById('btn-next');
    const btnPrev = document.getElementById('btn-prev');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    let isPlaying = false;
    let currentDuration = 0;
    let currentTime = 0;

    // Called directly by Cocoa AppKit controller to expand or collapse smoothly
    window.setExpanded = function(expanded) {
      if (expanded) {
        container.classList.add('is-expanded');
      } else {
        container.classList.remove('is-expanded');
      }
    };

    function formatTime(secs) {
      if (!secs || isNaN(secs)) return '0:00';
      const m = Math.floor(secs / 60);
      const s = Math.floor(secs % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function updateUI(state) {
      if (!state) return;
      isPlaying = !!state.is_playing;
      currentDuration = state.duration || 0;
      currentTime = state.current_time || 0;

      const title = state.title || 'Music Studio';
      const artist = state.artist || 'Local Library';
      const cover = state.cover_url || 'placeholder.svg';

      miniTitle.textContent = title;
      expandedTitle.textContent = title;
      expandedArtist.textContent = artist;

      miniCover.src = cover;
      expandedCover.src = cover;

      if (isPlaying) {
        miniEq.classList.add('is-playing');
        miniCover.classList.add('is-spinning');
        vinylWrap.classList.add('is-spinning');
        iconPlay.style.display = 'none';
        iconPause.style.display = 'block';
      } else {
        miniEq.classList.remove('is-playing');
        miniCover.classList.remove('is-spinning');
        vinylWrap.classList.remove('is-spinning');
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
      }

      timeCurrent.textContent = formatTime(currentTime);
      timeDuration.textContent = formatTime(currentDuration);

      const percent = currentDuration > 0 ? (currentTime / currentDuration) * 100 : 0;
      scrubberFill.style.width = `${Math.min(100, Math.max(0, percent))}%`;
    }

    // Interactive controls
    btnPlay.addEventListener('click', (e) => {
      e.stopPropagation();
      fetch('/api/playback/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle' })
      }).catch(() => {});
    });

    btnNext.addEventListener('click', (e) => {
      e.stopPropagation();
      fetch('/api/playback/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'next' })
      }).catch(() => {});
    });

    btnPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      fetch('/api/playback/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'prev' })
      }).catch(() => {});
    });

    scrubberTrack.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!currentDuration) return;
      const rect = scrubberTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const seekTime = ratio * currentDuration;
      fetch('/api/playback/action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'seek', time: seekTime })
      }).catch(() => {});
    });

    // Real-time SSE Stream
    function initSSE() {
      const evt = new EventSource('/api/events');
      evt.onmessage = (e) => {
        try {
          const msg = JSON.parse(e.data);
          if (msg.type === 'playback') {
            updateUI(msg.data);
          }
        } catch (err) {}
      };
      evt.onerror = () => {
        evt.close();
        setTimeout(initSSE, 3000);
      };
    }

    // Initial Hydration
    fetch('/api/playback')
      .then(res => res.json())
      .then(data => updateUI(data))
      .catch(() => {});

    initSSE();
  </script>
</body>
</html>
