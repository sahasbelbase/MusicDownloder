name: Build Desktop Releases (macOS DMG & Windows EXE)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          brew install ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build macOS DMG
        run: |
          chmod +x package_dmg.sh
          ./package_dmg.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudio-macOS-DMG
          path: dist/MusicStudio-Installer.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg on Windows
        run: |
          choco install ffmpeg -y

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pywebview

      - name: Build Windows Standalone Executable
        run: |
          pyinstaller --clean -y windows_app.spec

      - name: Package Windows ZIP
        run: |
          Compress-Archive -Path dist/MusicStudio.exe -DestinationPath dist/MusicStudio-Windows.zip

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicStudio-Windows-EXE
          path: dist/MusicStudio-Windows.zip
